name: discord-integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discord-smoke:
    name: discord-smoke
    runs-on: ubuntu-latest
    env:
      DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      DISCORD_TEST_GUILD_ID: ${{ secrets.DISCORD_TEST_GUILD_ID }}
      DISCORD_TEST_CHANNEL_ID: ${{ secrets.DISCORD_TEST_CHANNEL_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Installer les dépendances système
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libssl-dev libsqlite3-dev sqlite3 pkg-config ripgrep jq curl
      - name: Installer Nolc
        run: |
          curl -fsSL https://noliae-nolc.s3.gra.io.cloud.ovh.net/nolc-latest-linux-x86_64.tar.gz | tar -xz
          find . -type f -name nolc -exec sudo install -m 0755 {} /usr/local/bin/nolc \;
      - name: Scanner les secrets versionnés
        run: ./scripts/secret_scan.sh
      - name: Compiler le bot
        run: ./check.sh
      - name: Tests d'intégration Discord complets
        run: ./scripts/discord_integration_test.sh
