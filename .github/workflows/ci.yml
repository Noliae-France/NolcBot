name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Vérifier l'absence de secrets
        run: ./scripts/secret_scan.sh

  build:
    name: build-linux
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les dépendances système
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev libssl-dev libsqlite3-dev sqlite3 pkg-config ripgrep jq curl
      - name: Installer Nolc
        shell: bash
        run: |
          archive="https://noliae-nolc.s3.gra.io.cloud.ovh.net/nolc-latest-linux-x86_64.tar.gz"
          curl -fsSL "$archive" | tar -xz
          find . -type f -name nolc -exec sudo install -m 0755 {} /usr/local/bin/nolc \;
      - name: Vérifier, tester et compiler
        run: ./check.sh
      - name: Préparer l'artefact
        shell: bash
        run: |
          mkdir -p dist
          suffix="$RUNNER_OS"
          cp bot "dist/nolcbot-${suffix}"
          chmod +x "dist/nolcbot-${suffix}"
          shasum -a 256 "dist/nolcbot-${suffix}" > "dist/nolcbot-${suffix}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: nolcbot-linux
          path: dist/*
          if-no-files-found: error

  release-preview:
    name: release-preview
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nolcbot-linux
          path: dist
      - name: Préparer le paquet release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/nolcbot-linux
          cp dist/nolcbot-Linux release/nolcbot-linux/nolcbot
          chmod +x release/nolcbot-linux/nolcbot
          (cd release/nolcbot-linux && shasum -a 256 nolcbot > nolcbot.sha256)
          cat > release/nolcbot-linux/manifest.txt <<EOF
          NolcBot release preview
          commit=${GITHUB_SHA}
          ref=${GITHUB_REF_NAME}
          platform=linux
          artifact=nolcbot-linux
          EOF
          tar -C release -czf nolcbot-linux-release.tar.gz nolcbot-linux
          shasum -a 256 nolcbot-linux-release.tar.gz > nolcbot-linux-release.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nolcbot-linux-release-preview
          path: |
            nolcbot-linux-release.tar.gz
            nolcbot-linux-release.tar.gz.sha256
          if-no-files-found: error
