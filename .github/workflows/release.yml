name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release:
    name: build-release-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les dépendances système
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libssl-dev libsqlite3-dev sqlite3 pkg-config ripgrep jq curl
      - name: Installer Nolc
        run: |
          curl -fsSL https://noliae-nolc.s3.gra.io.cloud.ovh.net/nolc-latest-linux-x86_64.tar.gz | tar -xz
          find . -type f -name nolc -exec sudo install -m 0755 {} /usr/local/bin/nolc \;
      - name: Scanner les secrets versionnés
        run: ./scripts/secret_scan.sh
      - name: Vérifier, tester et compiler
        run: ./check.sh
      - name: Préparer l'artefact
        run: |
          mkdir -p dist
          cp bot dist/nolcbot-linux
          chmod +x dist/nolcbot-linux
          shasum -a 256 dist/nolcbot-linux > dist/nolcbot-linux.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nolcbot-linux
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: publish-release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
