name: build-noliae-discord

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer les dépendances système
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libssl-dev libsqlite3-dev sqlite3
      - name: Installer Nolc
        run: |
          curl -fsSL https://noliae-nolc.s3.gra.io.cloud.ovh.net/nolc-latest-linux-x86_64.tar.gz | tar -xz
          find . -type f -name nolc -exec sudo install -m 0755 {} /usr/local/bin/nolc \;
      - name: Vérifier, tester et compiler
        run: ./check.sh
