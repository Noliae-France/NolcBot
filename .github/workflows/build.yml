name: build

# Build direct sur le runner self-hosted DÉDIÉ Noliae `nolc-public` (nolc +
# libsodium/OpenSSL bakés dans l'image maison). Compile et exécute le selftest.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: [self-hosted, nolc-public]
    steps:
      - uses: actions/checkout@v4

      - name: Version de nolc (baké dans le runner)
        run: nolc --version

      - name: Build + exécution du selftest
        run: |
          nolc build examples/selftest.nol -o selftest --lien sodium --lien ssl --lien crypto
          ./selftest
